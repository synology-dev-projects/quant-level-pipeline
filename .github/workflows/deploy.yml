name: Branch-Based Deployment Pipeline

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-branch:
    runs-on: self-hosted

    steps:
      # 1. CLEANUP (Runner Workspace)
      - name: Clean Runner Workspace
        run: |
          echo "🧹 Cleaning previous runner artifacts..."
          rm -rf ./*
          rm -rf ./.??*

      # 2. CHECKOUT
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      # 3. SETUP VARIABLES (Calculate Path EARLY)
      - name: Configure Deployment Paths
        run: |
          # Ensure conf directory and syno_paths.env exist
          umask 002
          mkdir -p ../../conf
          if [ ! -f ../../conf/syno_paths.env ]; then
            echo "SYNOLOGY_ROOT_PATH=/volume2/docker" > ../../conf/syno_paths.env
          fi

          cat ../../conf/syno_paths.env >> $GITHUB_ENV
          source ../../conf/syno_paths.env

          # Calculate Variables
          BRANCH_NAME="${{ github.ref_name }}"
          REPO_NAME="${{ github.event.repository.name }}"
          
          TARGET_PATH="${SYNOLOGY_ROOT_PATH}/${BRANCH_NAME}/${REPO_NAME}"
          
          echo "📂 Target Path: $TARGET_PATH"
          echo "DEPLOY_DIR=$TARGET_PATH" >> $GITHUB_ENV

      # 4. DEPLOY CODE (Copy files BEFORE installing deps)
      - name: Sync Code to Project Root
        run: |
          TARGET_PATH="${{ env.DEPLOY_DIR }}"
          mkdir -p "$TARGET_PATH"

          # Wipe OLD source code (preserves .venv dot-folder)
          echo "🧹 Wiping old src/, tests/, and configs..."
          rm -rf "$TARGET_PATH"/*

          # Copy NEW files to the persistent project root
          echo "🚀 Copying new files..."
          cp -r src "$TARGET_PATH/"
          cp -r tests "$TARGET_PATH/"
          cp verify.sh "$TARGET_PATH/"
          
          sudo chown -R 1026:100 "$TARGET_PATH"
          chmod -R 775 "$TARGET_PATH"
          
          # Copy requirement files if they exist
          [ -f requirements.txt ] && cp requirements.txt "$TARGET_PATH/"
          [ -f requirements.in ] && cp requirements.in "$TARGET_PATH/"

      # 4.5 SETUP PYTHON
      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      # 5. MANAGE VENV (Run execution INSIDE Project Root)
      - name: Update Project Virtualenv
        run: |
          cd "${{ env.DEPLOY_DIR }}"
          
          # 1. Create .venv if missing or if Python version < 3.12
          if [ ! -d ".venv" ] || ! .venv/bin/python -c "import sys; exit(0 if sys.version_info >= (3, 12) else 1)" 2>/dev/null; then
            echo "🔨 Creating new Python 3.13 virtual environment in project root..."
            rm -rf .venv
            python3 -m venv .venv
          else
            echo "✅ Existing .venv found. Updating..."
          fi
          
          # 2. Activate
          source .venv/bin/activate
          pip install --upgrade pip
          
          # 3. Compile/Install (Only compile if requirements.txt does not exist)
          if [ ! -f "requirements.txt" ] && [ -f "requirements.in" ]; then
            echo "🔄 Compiling requirements.in..."
            pip install --upgrade pip-tools
            pip-compile requirements.in --output-file=requirements.txt
          fi

          pip install -r requirements.txt            
          
          # Inject local common-lib dependency
          echo "📦 Installing local common-lib..."
          pip install -e ../common-lib
          
          # 4. Add to Path (so verify.sh finds it)
          echo "$PWD/.venv/bin" >> $GITHUB_PATH

      # 6. VERIFICATION
      - name: Run Verification
        run: |
          echo "🧪 Testing branch: ${{ github.ref_name }}"
          cd "${{ env.DEPLOY_DIR }}"
          
          # Force the environment to use the local venv first
          export PATH="$(pwd)/.venv/bin:$PATH"
          
          chmod +x verify.sh
          ./verify.sh

      # 7. MERGE LOGIC
      - name: Auto-Promote to Master
        if: github.ref_name == 'develop'
        run: |
          echo "✅ Develop verified. Promoting to Master..."
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          git fetch origin develop
          git checkout master
          git pull origin master
          git merge origin/develop --no-ff -m "Auto-merge develop to master [Skip CI]"
          git push origin master